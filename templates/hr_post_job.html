{% extends 'base.html' %}
{% block title %}Post a Job — RecruitAI{% endblock %}
{% block content %}
<div class="container" style="max-width:800px">
  <div class="page-header">
    <div class="page-title">Post a New Job</div>
    <div class="page-sub">The more specific you are, the better the AI match scores</div>
  </div>
  <div class="card">
    <form method="POST">
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Job Title *</label><input name="title" class="form-control" placeholder="Senior Python Developer" required></div>
        <div class="form-group"><label class="form-label">Company *</label><input name="company" class="form-control" placeholder="TechCorp India" required></div>
        <div class="form-group"><label class="form-label">Location *</label><input name="location" class="form-control" placeholder="Pune, Maharashtra" required></div>
        <div class="form-group"><label class="form-label">Job Type *</label>
          <select name="job_type" class="form-control" required>
            <option>Full-time</option><option>Part-time</option><option>Contract</option><option>Internship</option><option>Remote</option>
          </select></div>
        <div class="form-group"><label class="form-label">Salary Range</label><input name="salary" class="form-control" placeholder="₹8-12 LPA"></div>
        <div class="form-group"><label class="form-label">Application Deadline</label><input name="deadline" type="date" class="form-control"></div>
      </div>
      <div class="form-group"><label class="form-label">Job Description *</label><textarea name="description" class="form-control" style="min-height:120px" placeholder="Describe the role, responsibilities, and what you're looking for..." required></textarea></div>
      <div class="form-group">
        <label class="form-label">Required Skills * <span style="color:var(--muted);font-weight:400">(comma-separated)</span></label>
        <input name="required_skills" class="form-control" placeholder="Python, Django, REST API, PostgreSQL, Docker" required>
        <div style="color:var(--muted);font-size:.8rem;margin-top:.3rem">⚡ These are used by the AI scoring engine. Be specific!</div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Required Experience</label><input name="required_experience" class="form-control" placeholder="3+ years"></div>
        <div class="form-group"><label class="form-label">Required Education</label><input name="required_education" class="form-control" placeholder="B.Tech / B.E. in CS or related"></div>
      </div>
      <div style="display:flex;gap:1rem">
        <button class="btn btn-primary" style="flex:1;justify-content:center;padding:.8rem">🚀 Post Job</button>
        <a href="{{ url_for('hr_posts') }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
